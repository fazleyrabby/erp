name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, linux, laravel]

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via rsync
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.git' \
            --exclude 'vendor' \
            --exclude 'node_modules' \
            --exclude 'public/build' \
            --exclude 'storage' \
            --exclude 'bootstrap/cache' \
            "$GITHUB_WORKSPACE/" \
            /home/fazley/apps/erp/

      - name: Install PHP deps
        run: docker exec erp_app composer install --no-dev --optimize-autoloader

      - name: Deploy & restart
        run: |
          cd /home/fazley/apps/erp
          docker compose -f docker-compose.prod.yml up -d --no-deps --build app

      - name: Post-deploy
        run: |
          docker exec erp_app php artisan migrate --force
          docker exec erp_app php artisan optimize:clear
          docker exec erp_app php artisan config:cache
          docker exec erp_app php artisan view:cache

      - name: Health check
        run: |
          docker exec erp_app php artisan about --only=environment 2>/dev/null || true
          docker ps --filter name=erp_app --format "{{.Names}} {{.Status}}"
